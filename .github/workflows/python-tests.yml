name: Python - pruebas internas

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autotest:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v7
      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Verificar sintaxis
        run: python -m py_compile src/rutas_salud_panama_floyd.py
      - name: Ejecutar las pruebas internas
        run: python src/rutas_salud_panama_floyd.py --autotest
